# webitel-kb configuration (example).

service:
  addr: "127.0.0.1:22106"      # TODO: confirm webitel-kb's assigned port
  internal:
    # Service token of the indexer API; empty disables it, minimum 32 characters.
    token: ""
  conn:
    verify_certs: false

log:
  level: "info"
  json: true
  otel: false
  file: ""
  console: true

postgres:
  dsn: "postgres://postgres:postgres@127.0.0.1:5432/webitel?application_name=webitel-kb&sslmode=disable&connect_timeout=10"

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

consul:
  addr: "127.0.0.1:8500"

pubsub:
  url: "amqp://webitel:webitel@127.0.0.1:5672/"
  driver: "amqp"

relay:
  poll_interval: 1s
  publish_timeout: 5s
  retention: 72h
  cleanup_interval: 24h
  cleanup_batch: 5000
